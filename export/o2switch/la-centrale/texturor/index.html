<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Texturor - Laboratoire de Textures & Styles CSS</title>
    <style>
        :root {
            --bg-dark: #121214;
            --bg-panel: #1a1a1e;
            --bg-card: #222228;
            --border-color: #33333d;
            --text-main: #e1e1e6;
            --text-muted: #888899;
            --accent: #00b37e;
            --accent-hover: #00875f;
            --control-height: 38px;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Custom Scrollbar moderne */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }

        ::-webkit-scrollbar-thumb {
            background: #444452;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        * {
            scrollbar-width: thin;
            scrollbar-color: #444452 transparent;
        }

        header {
            height: 70px;
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 10;
            flex-shrink: 0;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--accent);
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            height: var(--control-height);
            line-height: 1;
            margin: 0;
        }

        .search-container {
            flex-grow: 1;
            max-width: 450px;
            margin: 0 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-input {
            width: 100%;
            height: var(--control-height) !important;
            min-height: var(--control-height) !important;
            max-height: var(--control-height) !important;
            padding: 0 16px;
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
            box-sizing: border-box;
            font-family: inherit;
            background-image: none !important;
            box-shadow: none !important;
        }

        .search-input:focus {
            border-color: var(--accent);
        }

        .btn-filter-trigger {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            white-space: nowrap;
            position: relative;
            background-image: none !important;
            box-shadow: none !important;
        }

        .filter-badge {
            width: 8px;
            height: 8px;
            background-color: var(--accent);
            border-radius: 50%;
            display: none;
        }

        .btn-filter-trigger.active .filter-badge {
            display: inline-block;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Uniformisation stricte de tous les boutons du header */
        .btn,
        button.btn,
        a.btn {
            height: var(--control-height) !important;
            min-height: var(--control-height) !important;
            max-height: var(--control-height) !important;
            background-color: var(--accent);
            color: #ffffff;
            border: 1px solid transparent;
            padding: 0 16px;
            border-radius: 6px;
            font-size: 0.88rem;
            font-family: inherit;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.2s, border-color 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            line-height: 1;
            margin: 0;
            outline: none;
            vertical-align: middle;
            appearance: none;
            -webkit-appearance: none;
            background-image: none !important;
            box-shadow: none !important;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: transparent;
            border-color: var(--border-color);
            color: var(--text-main);
            background-image: none !important;
            box-shadow: none !important;
        }

        .btn-secondary:hover {
            background-color: var(--border-color);
        }

        .btn-danger {
            background-color: #d9534f;
            border-color: transparent;
            color: #ffffff;
            background-image: none !important;
            box-shadow: none !important;
        }

        .btn-danger:hover {
            background-color: #c9302c;
        }

        /* --- Panneau Coulissant (Drawer) --- */
        .filter-drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(2px);
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .filter-drawer-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .filter-drawer {
            position: fixed;
            top: 0;
            left: 0;
            width: 340px;
            max-width: 85vw;
            height: 100vh;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border-color);
            z-index: 101;
            transform: translateX(-100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
        }

        .filter-drawer.open {
            transform: translateX(0);
        }

        .drawer-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .drawer-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--text-main);
        }

        .drawer-close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0 5px;
        }

        .drawer-close-btn:hover {
            color: var(--text-main);
        }

        .drawer-content {
            padding: 20px;
            overflow-y: auto;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .filter-group-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .filter-tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .drawer-tag-btn {
            background-color: var(--bg-card);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 0.82rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .drawer-tag-btn:hover {
            border-color: var(--accent);
            color: var(--text-main);
        }

        .drawer-tag-btn.active {
            background-color: var(--accent);
            border-color: var(--accent);
            color: #ffffff;
            font-weight: 600;
        }

        .drawer-footer {
            padding: 15px 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        /* --- Navigation par Onglets (Mobile / Tablette) --- */
        .mobile-view-tabs {
            display: none;
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
            width: 100%;
            flex-shrink: 0;
        }

        .mobile-tab-btn {
            flex: 1;
            height: 44px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: inherit;
        }

        .mobile-tab-btn.active {
            color: var(--text-main);
            border-bottom-color: var(--accent);
            background-color: var(--bg-dark);
        }

        .main-container {
            flex-grow: 1;
            display: flex;
            overflow: hidden;
        }

        .gallery-section {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .section-title {
            font-size: 1.1rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .texture-card {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
        }

        .texture-card:hover {
            border-color: var(--accent);
        }

        .card-preview {
            height: 140px;
            background-color: var(--bg-dark);
            border-bottom: 1px solid var(--border-color);
            position: relative;
            /* Indispensable pour positionner le voyant en haut à droite */
        }

        /* --- Le Voyant de Sélection (Rouge par défaut, Vert si .selected) --- */
        .texture-indicator {
            width: 16px;
            height: 16px;
            background-color: #ef4444;
            border-radius: 50% !important;
            cursor: pointer;
            transition: background-color 0.2s;
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 10;
            border: 2px solid #ffffff;
            box-shadow: 0 0 6px rgba(0, 0, 0, 0.8), 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .texture-indicator.selected {
            background-color: #22c55e;
        }

        .card-content {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-grow: 1;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
        }

        .card-footer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }

        .card-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .tag {
            font-size: 0.75rem;
            background-color: var(--bg-dark);
            color: var(--text-muted);
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .card-copy-btn {
            height: 28px;
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 0 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: inherit;
        }

        .card-copy-btn:hover {
            background-color: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .editor-section {
            width: 480px;
            background-color: var(--bg-panel);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .editor-header {
            height: 50px;
            padding: 0 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .editor-tabs {
            display: flex;
            gap: 10px;
        }

        .tab {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            padding-bottom: 4px;
            font-family: inherit;
        }

        .tab.active {
            color: var(--text-main);
            border-bottom: 2px solid var(--accent);
        }

        .code-box {
            flex-grow: 1;
            padding: 20px;
            background-color: #0d0d0f;
            color: #d4d4d4;
            font-family: monospace;
            font-size: 0.9rem;
            line-height: 1.5;
            overflow-x: auto;
            border: none;
            resize: none;
            outline: none;
        }

        .editor-footer {
            padding: 15px 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .editor-footer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tag-input {
            width: 100%;
            height: var(--control-height);
            padding: 0 12px;
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-main);
            font-size: 0.85rem;
            outline: none;
            box-sizing: border-box;
            font-family: inherit;
            background-image: none !important;
            box-shadow: none !important;
        }

        .tag-input:focus {
            border-color: var(--accent);
        }

        @media (max-width: 900px) {
            header {
                height: auto;
                padding: 12px 15px;
                flex-wrap: wrap;
                gap: 10px;
            }

            .logo {
                height: var(--control-height);
            }

            .search-container {
                order: 3;
                max-width: 100%;
                margin: 0;
                width: 100%;
            }

            .mobile-view-tabs {
                display: flex;
            }

            .editor-section {
                width: 100%;
                border-left: none;
            }

            .main-container.view-gallery .editor-section {
                display: none !important;
            }

            .main-container.view-editor .gallery-section {
                display: none !important;
            }
        }
    </style>
    <link rel="stylesheet" href="../global.css">
</head>

<body>

    <header>
        <div class="logo">TEXTUROR</div>
        <div class="search-container">
            <button class="btn btn-secondary btn-filter-trigger" id="openDrawerBtn">
                <span>Filtres</span>
                <span class="filter-badge"></span>
            </button>
            <input type="text" class="search-input" id="searchInput" placeholder="Rechercher par mot-clé...">
        </div>
        <div class="actions">
            <button class="btn btn-secondary" id="exportBtn">Exporter dossier</button>
            <button class="btn btn-danger" id="resetBtn">Réinitialiser</button>
            <a href="http://localhost/" class="btn btn-secondary" id="homeBtn">Home</a>
        </div>
    </header>

    <div class="mobile-view-tabs">
        <button class="mobile-tab-btn active" id="tabShowGallery">Catalogue</button>
        <button class="mobile-tab-btn" id="tabShowEditor">Éditeur</button>
    </div>

    <div class="filter-drawer-overlay" id="drawerOverlay"></div>
    <aside class="filter-drawer" id="filterDrawer">
        <div class="drawer-header">
            <span class="drawer-title">Filtrer le catalogue</span>
            <button class="drawer-close-btn" id="closeDrawerBtn">&times;</button>
        </div>
        <div class="drawer-content">
            <div>
                <div class="filter-group-title">Formes & Motifs</div>
                <div class="filter-tags-container">
                    <button class="drawer-tag-btn" data-tag="points">Points</button>
                    <button class="drawer-tag-btn" data-tag="lignes">Lignes</button>
                    <button class="drawer-tag-btn" data-tag="carreaux">Carreaux</button>
                    <button class="drawer-tag-btn" data-tag="zigzag">Zigzag</button>
                    <button class="drawer-tag-btn" data-tag="vagues">Vagues</button>
                    <button class="drawer-tag-btn" data-tag="losanges">Losanges</button>
                </div>
            </div>
            <div>
                <div class="filter-group-title">Couleurs & Tons</div>
                <div class="filter-tags-container">
                    <button class="drawer-tag-btn" data-tag="sombre">Sombre</button>
                    <button class="drawer-tag-btn" data-tag="noir">Noir</button>
                    <button class="drawer-tag-btn" data-tag="gris">Gris</button>
                    <button class="drawer-tag-btn" data-tag="couleur">Couleur</button>
                    <button class="drawer-tag-btn" data-tag="doré">Doré</button>
                </div>
            </div>
            <div>
                <div class="filter-group-title">Matières & Effets</div>
                <div class="filter-tags-container">
                    <button class="drawer-tag-btn" data-tag="pierre">Pierre</button>
                    <button class="drawer-tag-btn" data-tag="cuir">Cuir</button>
                    <button class="drawer-tag-btn" data-tag="métal">Métal</button>
                    <button class="drawer-tag-btn" data-tag="tissu">Tissu</button>
                    <button class="drawer-tag-btn" data-tag="papier">Papier</button>
                </div>
            </div>
            <div>
                <div class="filter-group-title">Ambiance & Style</div>
                <div class="filter-tags-container">
                    <button class="drawer-tag-btn" data-tag="souple">Souple</button>
                    <button class="drawer-tag-btn" data-tag="rigide">Rigide</button>
                    <button class="drawer-tag-btn" data-tag="fête">Fête</button>
                    <button class="drawer-tag-btn" data-tag="luxe">Luxe</button>
                    <button class="drawer-tag-btn" data-tag="futuriste">Futuriste</button>
                    <button class="drawer-tag-btn" data-tag="rétro">Rétro</button>
                    <button class="drawer-tag-btn" data-tag="discret">Discret</button>
                    <button class="drawer-tag-btn" data-tag="technique">Technique</button>
                </div>
            </div>
        </div>
        <div class="drawer-footer">
            <button class="btn btn-secondary" id="clearFilterBtn" style="font-size: 0.8rem;">Effacer les
                filtres</button>
            <button class="btn" id="applyDrawerBtn" style="padding: 0 14px; font-size: 0.85rem;">Voir les
                résultats</button>
        </div>
    </aside>

    <div class="main-container view-gallery" id="mainContainer">
        <section class="gallery-section">
            <h2 class="section-title">Catalogue de textures & styles</h2>
            <div class="cards-grid" id="cardsGrid">
                <!-- Les cartes injectées dynamiquement devront inclure <div class="texture-indicator" data-texture-id="..." onclick="event.stopPropagation(); toggleTextureSelection(this, '...')"></div> dans leur .card-preview -->
            </div>
        </section>

        <aside class="editor-section">
            <div class="editor-header">
                <div class="editor-tabs">
                    <button class="tab active">SCSS / CSS</button>
                </div>
                <button class="btn btn-secondary"
                    style="height: 30px !important; min-height: 30px !important; max-height: 30px !important; padding: 0 10px; font-size: 0.8rem;"
                    id="copyBtn">Copier tout</button>
            </div>
            <textarea class="code-box" id="codeBox" spellcheck="false"
                placeholder="Écris ou colle ton code SCSS/CSS ici..."></textarea>
            <div class="editor-footer">
                <input type="text" id="tagInput" class="tag-input"
                    placeholder="Tags séparés par des virgules (ex: damier, sombre)">
                <div class="editor-footer-row">
                    <span style="font-size: 0.85rem; color: var(--text-muted);">Persistant en local</span>
                    <button class="btn" id="applyBtn" style="font-size: 0.85rem;">Enregistrer & Appliquer</button>
                </div>
            </div>
        </aside>
    </div>

    <script src="js/app.js"></script>
    <script>
        // Gestion de la sélection par clic sur le voyant et persistance
        function toggleTextureSelection(element, textureId) {
            element.classList.toggle('selected');
            const isSelected = element.classList.contains('selected');
            localStorage.setItem('texture_selected_' + textureId, isSelected);
        }

        // Restauration de l'état des voyants au chargement
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.querySelectorAll('.texture-indicator').forEach(indicator => {
                    const textureId = indicator.getAttribute('data-texture-id');
                    if (textureId) {
                        const savedState = localStorage.getItem('texture_selected_' + textureId);
                        if (savedState === 'true') {
                            indicator.classList.add('selected');
                        }
                    }
                });
            }, 200); // Petit délai pour laisser le temps au script app.js de générer les cartes si elles sont dynamiques
        });
    </script>
</body>

</html>
