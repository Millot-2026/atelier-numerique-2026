<!DOCTYPE html>
<html lang='fr'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Persona : christophe MILLOT</title>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --bg: #f4f7f6; }
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--primary); margin: 0; padding: 20px; }
        .persona-container { max-width: 1000px; margin: 0 auto; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.1); display: grid; grid-template-columns: 300px 1fr; }
        .sidebar { background: var(--primary); color: white; padding: 30px; text-align: center; word-break: break-word; }
        .photo-placeholder { width: 150px; height: 150px; background: #bdc3c7; border-radius: 50%; margin: 0 auto 20px; border: 5px solid rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 50px; overflow:hidden; }
        .content { padding: 40px; }
        .grid-info { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: #fff; border: 1px solid #eee; padding: 15px; border-radius: 8px; border-left: 5px solid var(--accent); word-break: break-word; }
        h1 { margin: 0; font-size: 24px; }
        h3 { color: var(--accent); margin-top: 0; }

        @media (max-width: 768px) {
            .persona-container { grid-template-columns: 1fr; }
            .content { padding: 20px; }
            .grid-info { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class='persona-container'>
        <div class='sidebar'>
            <div class='photo-placeholder'>👤</div>
            <h1>christophe MILLOT</h1>
            <p style='margin-top: 5px;'>🎂 54 ans</p>
            <div style='margin-top: 15px; font-size: 0.9em; opacity: 0.9; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 12px;'><div>🏠 60 rue de clignancourt</div><div>📍 75018 Paris</div></div>
            <blockquote style='margin: 20px 0 0 0; padding: 12px; background: rgba(255,255,255,0.08); border-left: 4px solid var(--accent); font-style: italic; font-size: 0.95em; border-radius: 4px;'>“ citation de verbatim ”</blockquote>
        </div>
        <div class='content'>
            <div class='grid-info'>
                
                <div class='card'>
                    <h3>Situation familiale</h3>
                    <p>Célibataire</p>
                </div>
                <div class='card'>
                    <h3>Lieu de vie</h3>
                    <p>Appartement</p>
                </div>
                <div class='card'>
                    <h3>Psychologie</h3>
                    <p>Enjoué</p>
                </div>
                <div class='card'>
                    <h3>Traits de caractère</h3>
                    <p>Serieux</p>
                </div>
                <div class='card'>
                    <h3>Objectifs</h3>
                    <p>trouver du boulot</p>
                </div>
                <div class='card'>
                    <h3>Freins</h3>
                    <p>frein a disque</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
